spring.application.name=proteinaligner

# Acceso a RCSB PDB
app.pdb.base-url=https://rcsb.org
app.pdb.connect-timeout-seconds=5
app.pdb.request-timeout-seconds=10

app.pdb.cache-max-entries=100

# Alineamiento: tope de residuos por proteina (la memoria crece como n x m)
app.alignment.max-sequence-length=2000
services:
  app:
    build: .
    image: protein-aligner:latest
    container_name: protein-aligner
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
    mem_limit: 768m
    restart: unless-stopped
    # Se usa bash y /dev/tcp para no depender de que la imagen traiga curl
    healthcheck:
      test: 'bash -c "exec 3<>/dev/tcp/localhost/8080; printf \"GET /actuator/health HTTP/1.0\r\n\r\n\" >&3; grep -q UP <&3"'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s